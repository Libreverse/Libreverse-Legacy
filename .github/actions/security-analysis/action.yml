name: "Security Analysis"
description: "Run security analysis tools (SAST)"

inputs:
    tool:
        description: "Security tool to run (brakeman)"
        required: true

runs:
    using: "composite"
    steps:
        # Scan the committed tree — do not bundle/bun update first (that scanned unpinned deps).
        - name: Run Brakeman
          if: inputs.tool == 'brakeman'
          shell: bash
          run: bundle exec brakeman -A --except WeakHash --quiet --no-summary --no-pager
