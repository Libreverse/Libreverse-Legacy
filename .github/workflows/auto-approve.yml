name: Auto approve

on:
  pull_request_target:
    types: [opened, synchronize, reopened]
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

# Set repository variable AUTODEP_MERGE_ENABLED=true to allow bot merge (patch/minor/actions).
# Major merges require AUTODEP_MAJOR_MERGE_ENABLED=true and passing gates + verify.

jobs:
  auto-approve:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read
      checks: read
    steps:
      # Always check out the base branch (trusted), never the PR head.
      # Classification uses event payload + gh pr diff (API), not untrusted workspace code.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.event_name == 'pull_request_target'
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        if: github.event_name == 'pull_request_target' && github.actor == 'dependabot[bot]'
        with:
          bun-version-file: .bun-version

      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Classify Dependabot bump
        if: github.event_name == 'pull_request_target' && github.actor == 'dependabot[bot]'
        id: semver
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_REPO: ${{ github.repository }}
        run: bun scripts/dependabot-semver-classify.mjs

      - uses: hmarr/auto-approve-action@f0939ea97e9205ef24d872e76833fa908a770363 # v4.0.0
        if: github.event_name == 'pull_request_target' && github.actor == 'dependabot[bot]'
        with:
          github-token: ${{ steps.app-token.outputs.token }}

      - name: Auto-merge Dependabot PR
        if: |
          github.event_name == 'pull_request_target' &&
          github.actor == 'dependabot[bot]' &&
          vars.AUTODEP_MERGE_ENABLED == 'true' &&
          (
            steps.semver.outputs.automerge_tier == 'auto' ||
            (vars.AUTODEP_MAJOR_MERGE_ENABLED == 'true' && steps.semver.outputs.automerge_tier == 'major-conditional')
          )
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          PR="${{ github.event.pull_request.number }}"
          REPO="${{ github.repository }}"
          REQUIRED_CHECKS=(
            "Dependency gates"
            "Install dependencies"
            "Verify (aggregate)"
          )
          for attempt in $(seq 1 90); do
            mapfile -t rows < <(gh pr checks "$PR" --repo "$REPO" --json name,state --jq '.[] | "\(.name)\t\(.state)"')
            pending=0
            failed=0
            for required in "${REQUIRED_CHECKS[@]}"; do
              state=$(printf '%s\n' "${rows[@]}" | awk -F'\t' -v n="$required" '$1==n {print $2; exit}')
              if [ -z "$state" ]; then
                pending=$((pending + 1))
                continue
              fi
              case "$state" in
                SUCCESS|SKIPPED|NEUTRAL) ;;
                PENDING|IN_PROGRESS|QUEUED|WAITING) pending=$((pending + 1)) ;;
                *)
                  echo "::error::Required check '$required' is $state"
                  exit 1
                  ;;
              esac
            done
            if [ "$pending" -eq 0 ]; then
              echo "Required rolling checks passed."
              break
            fi
            echo "Waiting for required checks ($pending pending)... attempt $attempt/90"
            sleep 30
          done
          if [ "$pending" -ne 0 ]; then
            echo "::error::Timed out waiting for required checks"
            exit 1
          fi
          gh pr merge "$PR" --repo "$REPO" --rebase --delete-branch --auto

      - name: Bulk retry stale Dependabot PRs
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          REPO="${{ github.repository }}"
          if [ "${{ vars.AUTODEP_MERGE_ENABLED }}" != "true" ]; then
            echo "AUTODEP_MERGE_ENABLED is not true; approving only."
          fi
          prs=$(gh pr list --repo "$REPO" --author "dependabot[bot]" --state open --json number --jq '.[].number')
          for pr in $prs; do
            echo "Approving PR #$pr"
            gh pr review --repo "$REPO" "$pr" --approve || true
            if [ "${{ vars.AUTODEP_MERGE_ENABLED }}" = "true" ]; then
              gh pr merge --repo "$REPO" "$pr" --rebase --delete-branch --auto || echo "Merge deferred for #$pr"
            fi
          done
