name: Socket post-merge baseline

# Quota-conscious: no scan on every push. Run manually or weekly.
on:
  schedule:
    - cron: "0 8 * * 0"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  post-merge-scan:
    runs-on: ubuntu-22.04
    env:
      SOCKET_API_KEY: ${{ secrets.SOCKET_API_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Socket full scan
        id: scan
        env:
          SOCKET_SECURITY_API_KEY: ${{ env.SOCKET_API_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${SOCKET_API_KEY:-}" ]; then
            echo "SOCKET_API_KEY not set; skipping post-merge scan."
            exit 0
          fi
          pip install socketsecurity --upgrade
          socketcli --target-path "$GITHUB_WORKSPACE" --scm api --pr-number 0 \
            --sarif-file socket-full.sarif --config .socketcli.toml
          bun scripts/socket-policy-filter.mjs socket-full.sarif

      - name: Update baseline metadata
        if: success() && steps.scan.outcome == 'success'
        run: |
          if [ ! -f socket-full.sarif ]; then exit 0; fi
          bun scripts/socket-update-baseline.mjs socket-full.sarif

      - uses: actions/create-github-app-token@v3
        if: success() && steps.scan.outcome == 'success'
        id: baseline-token
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Commit baseline update
        if: success() && steps.scan.outcome == 'success'
        env:
          GH_TOKEN: ${{ steps.baseline-token.outputs.token }}
        run: |
          set -euo pipefail
          if [ ! -f .github/socket-baseline.json ]; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/socket-baseline.json
          git diff --staged --quiet && exit 0
          git commit -m "chore(socket): update post-merge baseline"
          git push origin main
